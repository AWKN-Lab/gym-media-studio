[package]
name = "lynvos-studio"
version = "1.0.0"
description = "凌扬运动 LYNVOS FIT 自媒体自动化工作台"
authors = ["LYNVOS FIT"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "lynvos-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
